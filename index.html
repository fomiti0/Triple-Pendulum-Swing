$('best').textContent='BEST '+best.toFixed(2)+' m';
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(H/4.6,W/6);PY=.8*S}
addEventListener('resize',resize);resize();
function reset(){
  P=[{x:0,y:0}];let y=0;
  for(let i=0;i<3;i++){y+=L[i];P.push({x:.04*(i+1),y})}
  Q=P.map(p=>({x:p.x,y:p.y}));
  state='swing';cam=0;landed=false;settle=0;flyT=0;landT=0;dist=0;Zm=1;
  $('res').style.display='none';$('fb').style.display='none';$('help').style.display='';$('big').textContent='';$('dir').textContent='';
}
function lim(ax,ay,b,c,max,len){
  const d1=Math.atan2(b.y-ay,b.x-ax),d2=Math.atan2(c.y-b.y,c.x-b.x);
  let r=d2-d1;r=Math.atan2(Math.sin(r),Math.cos(r));
  if(Math.abs(r)>max){r=Math.sign(r)*max;c.x=b.x+len*Math.cos(d1+r);c.y=b.y+len*Math.sin(d1+r)}
}
function link(a,b,len,fixA){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,k=(d-len)/d;
  if(fixA){b.x-=dx*k;b.y-=dy*k}else{a.x+=dx*k*.5;a.y+=dy*k*.5;b.x-=dx*k*.5;b.y-=dy*k*.5}
}
function couple(a,b,f,dt){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,k=f*dt*dt;
  b.x+=nx*k;b.y+=ny*k;a.x-=nx*k;a.y-=ny*k;
}
const rel=(a,b,c)=>{const r=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(b.y-a.y,b.x-a.x);return Math.atan2(Math.sin(r),Math.cos(r))};
function step(dt){
  const ax=(keys.d?1:0)-(keys.a?1:0),fly=state==='fly';
  const damp=fly?.99998:.99995;
  for(let i=1;i<=3;i++){
    const p=P[i],q=Q[i],ox=p.x,oy=p.y;
    let vx=(p.x-q.x)*damp,vy=(p.y-q.y)*damp;const vm=Math.hypot(vx,vy),vcap=14*dt;if(vm>vcap){vx*=vcap/vm;vy*=vcap/vm}
    const fx=0;
    p.x+=vx+fx*dt*dt;p.y+=vy+G*dt*dt;q.x=ox;q.y=oy;
  }
  const ks=25,cx=fly?0:ax;
  if(!fly)couple(P[1],P[2],-cx*30-ks*rel(P[0],P[1],P[2]),dt);
  couple(P[2],P[3],-cx*30-ks*rel(P[1],P[2],P[3]),dt);
  for(let it=0;it<16;it++){
    if(!fly){P[0].x=0;P[0].y=0;link(P[0],P[1],L[0],true)}
    link(P[1],P[2],L[1],false);link(P[2],P[3],L[2],false);
    if(!fly){lim(0,-1,P[0],P[1],2.2,L[0]);lim(P[0].x,P[0].y,P[1],P[2],1.9,L[1]);lim(P[1].x,P[1].y,P[2],P[3],1.9,L[2])}
    else lim(P[1].x,P[1].y,P[2],P[3],2.6,L[2]);
    for(let i=1;i<=3;i++)if(P[i].y>GY){
      P[i].y=GY;Q[i].y=GY;
      Q[i].x=P[i].x-(P[i].x-Q[i].x)*(fly?.5:.9);
      if(fly)landed=true;
    }
  }
}
function jump(){
  if(state!=='swing')return;
  state='fly';$('help').style.display='none';
  let mvx=0,mvy=0;for(let i=1;i<=3;i++){mvx+=(P[i].x-Q[i].x)/3;mvy+=(P[i].y-Q[i].y)/3}
  for(let i=1;i<=3;i++){
    const p=P[i],q=Q[i];
    let vx=.5*(p.x-q.x)+.5*mvx;
    let vy=.5*(p.y-q.y)+.5*mvy-1.5/480;
    q.x=p.x-vx;q.y=p.y-vy;
  }
}
function finish(){
  state='done';dist=Math.abs(P[1].x);
  let nb=dist>best;
  if(nb){best=dist;try{localStorage.setItem('swing_best',String(best))}catch(e){}}
  $('best').textContent='BEST '+best.toFixed(2)+' m';
  $('rd').textContent=dist.toFixed(2)+' m';
  $('rb').textContent=nb?'🎉 ベスト更新！':'ベスト '+best.toFixed(2)+' m';
  $('tw').href='https://twitter.com/intent/tweet?text='+encodeURIComponent('ぐにゃぐにゃ三重ブランコからジャンプして '+dist.toFixed(2)+' m 飛んだ！ #三重ブランコ\nhttps://fomiti0.github.io/Triple-Pendulum-Swing/');
  $('big').textContent='';$('res').style.display='flex';
}
let Zm=1;const X=x=>W/2+(x-cam)*S*Zm,Y=y=>PY+GY*S-(GY-y)*S*Zm;
function line(a,b,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(X(a.x),Y(a.y));ctx.lineTo(X(b.x),Y(b.y));ctx.stroke()}
function draw(){
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,dark?'#0c1020':'#8fd0ff');g.addColorStop(1,dark?'#1c2440':'#e8f6ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gy=Y(GY);
  ctx.fillStyle=dark?'#26402c':'#6cc070';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle=dark?'#e8edf8':'#1c2230';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.lineCap='round';
  const sc=S*Zm,stp=[2,5,10,20,50,100,200].find(v=>v*sc>=60)||200;
  const x0=Math.floor((cam-W/sc/2)/stp)*stp;
  for(let m=x0;m<cam+W/sc/2+stp;m+=stp){
    const sx=X(m);ctx.fillRect(sx-1,gy,2,8);ctx.fillText(Math.abs(m)+'m',sx,gy+22);
  }
  line({x:-1.4,y:GY},{x:0,y:-.05},7,'#8a5a3a');line({x:1.4,y:GY},{x:0,y:-.05},7,'#8a5a3a');
  if(state==='swing')line(P[0],P[1],3,'#555');
  line(P[1],P[2],11,'#e8553d');line(P[2],P[3],9,'#3d6fe8');
  ctx.fillStyle='#8a5a3a';ctx.fillRect(X(P[1].x)-14,Y(P[1].y)-3,28,6);
  {const a=Math.atan2(P[2].y-P[1].y,P[2].x-P[1].x)-Math.PI/2,z=.5*S*Math.max(Zm,.45);ctx.save();ctx.translate(X(P[2].x),Y(P[2].y));ctx.rotate(a);
  if(FACE.complete&&FACE.naturalWidth){const zh=z*FACE.naturalHeight/FACE.naturalWidth;ctx.drawImage(FACE,-z/2,-zh/2,z,zh)}else{ctx.fillStyle='#f3e3c8';ctx.beginPath();ctx.arc(0,0,z*.4,0,7);ctx.fill()}
  ctx.restore()}
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(X(P[3].x),Y(P[3].y),.07*S,0,7);ctx.fill();
}
function frame(now){
  const dt=Math.min(.033,(now-last)/1000||.016);last=now;
  if(state!=='done'&&started){
    for(let k=0;k<SUB;k++)step(dt/SUB);
    if(state==='fly'){
      flyT+=dt;
      const mx=(P[1].x+P[2].x+P[3].x)/3;cam+=(mx-cam)*.12;
      let dx=0,ym=GY;for(let i=1;i<=3;i++){dx=Math.max(dx,Math.abs(P[i].x-cam));ym=Math.min(ym,P[i].y)}
      const tz=Math.max(.06,Math.min(.6,(W/2*.7)/(S*Math.max(dx,.5)),(PY+GY*S)*.85/(S*Math.max(GY-ym,.5))));
      Zm+=(Math.min(tz,Zm)-Zm)*.1;
      const cur=Math.abs(P[1].x);
      $('big').textContent=cur.toFixed(2)+' m';$('dir').textContent=P[1].x<0?'◀ 左へ':'右へ ▶';
      if(landed){landT+=dt;let mv=0;for(let i=1;i<=3;i++)mv=Math.max(mv,Math.hypot(P[i].x-Q[i].x,P[i].y-Q[i].y)*SUB/dt);if(mv<.2)settle+=dt;else settle=0}
      if(settle>.8||landT>12||flyT>40)finish();
    }
  }
  draw();requestAnimationFrame(frame);
}
const km={a:'a',arrowleft:'a',d:'d',arrowright:'d'};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!started){if(k==='enter'||k===' '||k==='w'||k==='a'||k==='d'){e.preventDefault();start()}return}
  if(km[k]){keys[km[k]]=true;e.preventDefault()}
  else if(k==='w'||k==='arrowup'||k===' '){e.preventDefault();jump()}
  else if(k==='r')reset();
});
addEventListener('keyup',e=>{const k=km[e.key.toLowerCase()];if(k)keys[k]=false});
function hold(id,k){const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
hold('bA','a');hold('bD','d');
$('bW').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
$('rt').addEventListener('click',reset);
$('tw').addEventListener('click',e=>{
  e.preventDefault();
  const t='ぐにゃぐにゃ三重ブランコからジャンプして '+dist.toFixed(2)+' m 飛んだ！ #三重ブランコ\nhttps://fomiti0.github.io/Triple-Pendulum-Swing/';
  const u='https://twitter.com/intent/tweet?text='+encodeURIComponent(t);
  let w=null;try{w=window.open(u,'_blank');if(w)w.opener=null}catch(_){}
  if(w)return;
  if(navigator.share){navigator.share({text:t}).then(()=>{},()=>{});return}
  const fb=$('fb');fb.style.display='block';fb.innerHTML='';
  const ta=document.createElement('textarea');ta.readOnly=true;ta.value=t;ta.style.cssText='width:100%;height:64px;box-sizing:border-box;margin-top:8px';
  const m=document.createElement('div');m.style.cssText='font-size:13px;margin-top:4px';
  m.textContent='Xを直接開けなかったので、この文章をコピーして投稿してください。';
  fb.appendChild(ta);fb.appendChild(m);ta.focus();ta.select();
  try{navigator.clipboard.writeText(t).then(()=>{m.textContent='投稿文をコピーしました。Xを開いて貼り付けてください。'}).catch(()=>{})}catch(_){}
});
addEventListener('contextmenu',e=>e.preventDefault());
$('tface').src=FACE.src;
$('tbest').textContent=best>0?'ベスト '+best.toFixed(2)+' m':'';
function start(){started=true;$('title').style.display='none'}
$('go').addEventListener('click',start);
reset();requestAnimationFrame(frame);
</script></body></html>
